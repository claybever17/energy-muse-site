<style>
/* Two templates in one file, because a blog is two pages and they share
   everything: the listing, and one post. Which one renders depends on
   ?post= — the same switch /product/ and /meaning/ already use. */
.jhead{padding:clamp(30px,5vh,60px) 0 clamp(24px,3vw,38px)}
.jhead h1{font-family:var(--serif);font-weight:300;font-size:clamp(38px,5.4vw,62px);
  line-height:1.04;letter-spacing:-.018em;margin-top:14px}
.jhead .lead{margin-top:16px;max-width:52ch;color:var(--ink-soft)}

/* The lead post gets the width it deserves and the rest are a grid. A blog
   where every post is the same size has no editor in it. */
.jlead{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  gap:clamp(24px,4vw,54px);align-items:center;
  padding-bottom:clamp(30px,4vw,48px);border-bottom:1px solid var(--hair)}
.jlead .shot{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--tint)}
.jlead .shot img{width:100%;height:100%;object-fit:cover;display:block}
.jlead h2{font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.4vw,40px);
  line-height:1.1;letter-spacing:-.014em;margin:10px 0 0}
.jlead p{margin-top:14px;color:var(--ink-soft);max-width:52ch;line-height:1.6}
@media (max-width:820px){ .jlead{grid-template-columns:1fr;gap:18px} }

.jgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(20px,2.6vw,34px) clamp(18px,2.4vw,30px);padding:clamp(30px,4vw,50px) 0 0}
@media (max-width:900px){ .jgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:600px){ .jgrid{grid-template-columns:1fr;gap:26px} }
.jcard{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.jcard .shot{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--tint);
  border:1px solid var(--hair)}
.jcard .shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.jcard h3{font-family:var(--serif);font-weight:400;font-size:clamp(17px,1.7vw,20px);
  line-height:1.2;margin:13px 0 0}
.jcard p{margin-top:8px;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.jcard .k{font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--stone);margin-top:10px}
.jcard:hover h3{color:var(--copper)}

/* ---- one post ---- */
.post{max-width:none}
.post .back{display:inline-flex;align-items:center;gap:.45em;font-family:var(--sans);
  font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--stone);text-decoration:none;padding:11px 0;min-height:44px}
.post .back:hover{color:var(--copper)}
.post h1{font-family:var(--serif);font-weight:300;font-size:clamp(32px,4.6vw,54px);
  line-height:1.06;letter-spacing:-.018em;margin:6px 0 0;max-width:20ch}
.post .meta{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--stone);margin-top:18px}
.post .hero{margin-top:clamp(22px,3vw,34px);aspect-ratio:16/9;border-radius:10px;
  overflow:hidden;background:var(--tint)}
.post .hero img{width:100%;height:100%;object-fit:cover;display:block}
/* A measure, not the page. Body copy stops being readable somewhere around 75
   characters and their articles run to 2,183 words. */
.post .copy{max-width:66ch;margin:clamp(26px,3.4vw,42px) 0 0}
.post .copy p{color:var(--ink-soft);line-height:1.68;font-size:16px}
.post .copy p + p{margin-top:19px}
.post .copy h2{font-family:var(--serif);font-weight:400;font-size:clamp(21px,2.4vw,28px);
  line-height:1.16;margin:clamp(28px,3.4vw,40px) 0 0}
.post .copy h2 + p{margin-top:12px}
.jnext{margin-top:clamp(40px,5vw,68px);padding-top:clamp(26px,3vw,36px);
  border-top:1px solid var(--hair)}
.jnext .k{font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--stone)}
.missing{padding:clamp(50px,9vh,110px) 0}
/* ===== Sept 9: "Shop this post". Sara (review, 14:15): their current blog
   carries a product feed so the content is shoppable, and she wants it
   dynamic, not static. Here it is the products the article mentions, found
   by name in its own text, four at most, one per stone; a post that names
   nothing gets one of each kind the shop sells. On Shopify it is a product
   list metafield on the article, and the fallback is the bestsellers
   collection - the theme just outputs it. */
.jshop{margin-top:clamp(36px,4.6vw,60px);padding-top:clamp(24px,3vw,34px);border-top:1px solid var(--hair)}
.jshop .k{font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}
.jshop .jline{margin:8px 0 0;color:var(--ink-soft);font-size:15px}
.jrail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.8vw,24px);margin-top:clamp(18px,2.2vw,26px)}
.jprod{display:block;text-decoration:none;color:inherit;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.jprod:hover{transform:translateY(-3px)}
.jprod .shot{display:block;aspect-ratio:1;background:var(--tint);border-radius:4px;padding:9%}
.jprod .shot img{width:100%;height:100%;object-fit:contain;display:block}
.jprod .n{display:block;font-family:var(--sans);font-weight:600;font-size:13px;line-height:1.3;margin-top:11px;color:var(--ink)}
.jprod .tw{display:block;font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);line-height:1.45;margin-top:4px}
.jprod .p{display:block;font-family:var(--serif);font-size:16px;color:var(--copper-lo);margin-top:5px}
@media (max-width:700px){
  .jrail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--edge);gap:12px;margin-inline:calc(-1*var(--edge));padding-inline:var(--edge);padding-bottom:6px;scrollbar-width:none}
  .jrail::-webkit-scrollbar{display:none}
  .jprod{flex:0 0 46%;scroll-snap-align:start}
}
/* Sept 9: the index. A read cue on the hero, the kicker above each title in
   copper, and eight posts as two full rows of four on a wide screen instead of
   three rows with two orphans. */
.jlead .jmore{display:inline-flex;align-items:center;gap:.45em;margin-top:18px;font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--copper-lo)}
.jlead .jmore .a{transition:transform .3s cubic-bezier(.16,1,.3,1)}
.jlead:hover .jmore{color:var(--copper)}
.jlead:hover .jmore .a{transform:translateX(5px)}
.jcard .k{margin-top:12px;color:var(--copper-lo)}
.jcard .k + h3{margin-top:6px}
@media (min-width:1101px){ .jgrid{grid-template-columns:repeat(4,minmax(0,1fr))} }
/* Sept 9 (Clay's screenshot): the last row of cards ran straight into the
   footer. The index and the article both end in a grid, so the page's own
   container carries the room, not the grids. */
#journal{padding-bottom:clamp(48px,7vw,96px)}
.jmods{margin-top:clamp(40px,5vw,68px);padding-top:clamp(26px,3vw,36px);border-top:1px solid var(--hair)}
.jmods .k{font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}
.jmodrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,20px);margin-top:14px}
.jmod{display:block;padding:18px 18px 20px;border:1px solid var(--hair);border-radius:8px;text-decoration:none;color:inherit;background:var(--surface,#fff);transition:border-color .25s}
.jmod:hover{border-color:var(--copper)}
.jmod b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.2}
.jmod span{display:block;margin-top:6px;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.jquiz{margin:22px 0 0;font-size:15px;color:var(--ink-soft)}
@media (max-width:700px){.jmodrow{grid-template-columns:1fr}}
/* Sept 11, Sara (blog Loom, 2:05): "on desktop there's this big empty space... I
   kind of like on our current one how it puts the products up a little higher".
   Article and Shop this post side by side from 1000px, the rail two across in the
   column and sticky; one column below that, the rail after the article. */
@media (min-width:1000px){
  .jlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(28px,4vw,64px);align-items:start}
  .jside{position:sticky;top:96px}
  .jside .jshop{margin-top:0;padding-top:0;border-top:0}
  .jside .jrail{grid-template-columns:1fr 1fr;gap:14px 12px}
  .jside .jprod .n{font-size:12.5px}
}
.post .copy a{color:var(--copper-lo);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.post .copy a:hover{color:var(--copper)}
.post .copy h2,.post .copy h3{font-family:var(--serif);font-weight:400;margin:28px 0 10px;line-height:1.2}
.post .copy h2{font-size:clamp(22px,2.2vw,28px)}
.post .copy h3{font-size:clamp(19px,1.8vw,22px)}
.post .copy ul,.post .copy ol{padding-left:22px;margin:0 0 16px}
.post .copy li{margin:0 0 8px}
</style>
</head>
<body>
<main>
<div class="wrap" id="journal"></div>
</main>

<script>
(function () {
  'use strict';
  var host = document.getElementById('journal');
  var POSTS = window.EM_JOURNAL || [];
  var slug = (location.search.match(/[?&]post=([^&]*)/) || [, ''])[1];
  slug = slug ? decodeURIComponent(slug) : '';

  /* This deleted the characters instead of escaping them, so every title
     with an ampersand lost it: "Stay Grounded & Raise Your Vibration"
     rendered as "Stay Grounded  Raise Your Vibration". Escape, don't strip. */
  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function shot(p, cls) {
    if (!p.img) return '<span class="' + cls + '"></span>';
    return '<span class="' + cls + '"><img src="' + p.img + '-1200.webp" '
      + 'srcset="' + p.img + '-600.webp 600w, ' + p.img + '-1200.webp 1200w" '
      + 'sizes="(max-width:600px) 92vw, 30vw" alt="" loading="lazy" decoding="async"></span>';
  }
  /* Cutting at a character count lands mid-word - "plugging in c". Back up
     to the last space and add the ellipsis there. */
  function trim(t, n) {
    t = String(t || '');
    if (t.length <= n) return t;
    var cut = t.slice(0, n);
    var sp = cut.lastIndexOf(' ');
    return (sp > n * 0.6 ? cut.slice(0, sp) : cut).replace(/[,;:.!?\s]+$/, '') + '\u2026';
  }

  function niceDate(d) {
    if (!d) return '';
    var m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return d;
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1] + ' ' + (+m[3]) + ', ' + m[1];
  }
  function stamp(p) {
    /* Their articles carry no date and no author. Both exist on every Shopify
       article; this prints them the moment they are in the data, and says
       nothing rather than something invented while they are not. */
    return [niceDate(p.date), p.author].filter(Boolean).join(' &middot; ');
  }

  /* Shop this post: the products the article names, or one of each kind */
  var FORM = /\b(stones?|crystals?|tumbled|points?|pyramids?|clusters?|slices?|hearts?|towers?|bracelets?|necklaces?|rings?|earrings?|hoops?|kits?|sets?|bundles?|carvings?|angels?|skulls?|wands?|cubes?|bowls?|plates?|dragons?|signs?|flames?|diamonds?|pendants?|anklets?|touchstones?|for|the)\b/g;
  function shopThis(post) {
    var C = window.EM_CATALOG; if (!C) return null;
    var all = C.all();
    var txt = (post.title + ' ' + (post.excerpt || '') + ' ' + (post.body || []).map(function (b) { return String(b.x || '').replace(/<[^>]+>/g, ' '); }).join(' ')).toLowerCase();
    var byBase = {}, order = [];
    all.forEach(function (q) {
      var base = q.name.toLowerCase().replace(FORM, ' ').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
      if (base.length < 5) return;
      var at = txt.indexOf(base); if (at < 0) return;
      if (!byBase[base]) { byBase[base] = { at: at, p: q }; order.push(base); }
      else if (q.name.length < byBase[base].p.name.length) byBase[base].p = q;   /* the plainest piece of that stone */
    });
    order.sort(function (a, b) { return byBase[a].at - byBase[b].at; });
    var picks = order.slice(0, 4).map(function (b) { return byBase[b].p; });
    if (picks.length) return { line: 'Mentioned in this article.', items: picks, bases: order.slice(0, 4) };
    /* nothing named: one of each kind the shop sells, in its own order */
    var seen = {}, out = [];
    all.forEach(function (q) { if (!seen[q.cat] && q.stock !== 'out') { seen[q.cat] = true; out.push(q); } });
    return { line: 'From the shop.', items: out.slice(0, 4), bases: [] };
  }
  function prod(q) {
    return '<a class="jprod" href="/product/?id=' + encodeURIComponent(q.id) + '">'
      + '<span class="shot"><img src="' + q.img + '" alt="" loading="lazy"></span>'
      + '<span class="n">' + esc(q.name) + '</span>'
      + (q.three ? '<span class="tw">' + q.three.map(esc).join(' &middot; ') + '</span>' : '')
      + '<span class="p">$' + q.price.toFixed(2) + '</span></a>';
  }
  /* Sept 9 (Clay: "journal landing is bland?"): the cards said nothing but a
     title and a cut excerpt - their articles carry no date and no author. The
     stones a post works with are the kicker now, the matched base names, cased;
     a post that names no piece prints nothing rather than something invented. */
  function worksWith(post) {
    var sh = shopThis(post); if (!sh || !sh.bases.length) return '';
    return sh.bases.slice(0, 3).map(function (b) {
      return b.replace(/(^|\s)\w/g, function (m) { return m.toUpperCase(); }); }).join(' \u00b7 ');
  }
  function railHtml(sh, label) {
    return (sh && sh.items.length)
      ? '<section class="jshop" aria-label="' + label + '"><span class="k">' + label + '</span>'
        + '<p class="jline">' + sh.line + '</p>'
        + '<div class="jrail">' + sh.items.map(prod).join('') + '</div></section>'
      : '';
  }

  if (slug) {
    var p = POSTS.filter(function (x) { return x.slug === slug; })[0];
    if (!p) {
      host.innerHTML = '<div class="missing"><span class="eyebrow">Not found</span>'
        + '<h1>That post has moved.</h1><p class="lead" style="margin-top:14px">'
        + '<a class="em-link" href="/blog/">Back to the journal</a></p></div>';
      return;
    }
    document.title = 'Energy Muse — ' + p.title;
    var md = document.querySelector('meta[name="description"]');
    if (md && p.excerpt) md.setAttribute('content', p.excerpt);

    /* their article HTML, sanitised at import to paragraphs, headings, lists,
       emphasis and links (Sara, 2:38: "there's no links... links need to be
       pretty obvious") */
    var body = (p.body || []).map(function (b) {
      return b.t === 'html' ? b.x : b.t === 'h' ? '<h2>' + esc(b.x) + '</h2>' : '<p>' + esc(b.x) + '</p>';
    }).join('');
    if (!body && p.excerpt) body = '<p>' + esc(p.excerpt) + '</p>';

    var others = POSTS.filter(function (x) { return x.slug !== slug; }).slice(0, 3);

    var shopHtml = railHtml(shopThis(p), 'Shop this post');

    host.innerHTML =
        '<div class="jlayout">'
      + '<article class="post">'
      + '<a class="back" href="/blog/"><span aria-hidden="true">&larr;</span> The journal</a>'
      + '<h1>' + esc(p.title) + '</h1>'
      /* Sept 11, Sara (blog Loom, 1:38): every article attributed, to Heather by
         default, "just for SEO reasons"; a date only when the data has one */
      + '<div class="meta">By ' + esc(p.author || 'Heather Askinosie') + (p.date ? ' &middot; ' + esc(niceDate(p.date)) : '') + '</div>'
      + (p.img ? '<div class="hero"><img src="' + p.img + '-1200.webp" '
          + 'srcset="' + p.img + '-600.webp 600w, ' + p.img + '-1200.webp 1200w" '
          + 'sizes="(max-width:820px) 92vw, 70vw" alt="" fetchpriority="high"></div>' : '')
      + '<div class="copy">' + body + '</div>'
      + '</article>'
      + (shopHtml ? '<aside class="jside">' + shopHtml + '</aside>' : '')
      + '</div>'
      + (others.length
          ? '<section class="jnext"><span class="k">Keep reading</span>'
            + '<div class="jgrid">' + others.map(card).join('') + '</div></section>'
          : '')
      /* Sept 11, Sara (blog Loom, 3:08): "on the bottom... the builder, the build
         a box, the frequency... and a CTA to the energy quiz" */
      + '<section class="jmods"><span class="k">Make it your own</span><div class="jmodrow">'
      + '<a class="jmod" href="/designer/"><b>Build your own bracelet</b><span>Choose your beads, choose your design, and we build it for you.</span></a>'
      + '<a class="jmod" href="/box/"><b>Build your own crystal box</b><span>Your stones, packed with a card for each.</span></a>'
      + '<a class="jmod" href="/frequency/#tune"><b>The Frequency Room</b><span>Turn the dial. The room follows.</span></a>'
      + '</div><p class="jquiz">Not sure where to begin? <a class="em-link" href="/quiz/">Take the Energy Quiz <span class="a" aria-hidden="true">&rarr;</span></a></p></section>';
    return;
  }

  function card(p) {
    var kick = worksWith(p) || (p.author || '');
    return '<a class="jcard" href="?post=' + encodeURIComponent(p.slug) + '">'
      + shot(p, 'shot')
      + (kick ? '<span class="k">' + kick + '</span>' : '')
      + '<h3>' + esc(p.title) + '</h3>'
      + (p.excerpt ? '<p>' + esc(trim(p.excerpt, 130)) + '</p>' : '')
      + '</a>';
  }

  var lead = POSTS[0], rest = POSTS.slice(1);
  host.innerHTML =
      '<section class="jhead"><span class="eyebrow">The journal</span>'
    + '<h1>Practices, and what to work with now.</h1>'
    + '<p class="lead">Founder guidance, the month ahead, and how to actually use what you already own.</p>'
    + '</section>'
    + (lead
        ? '<a class="jlead" href="?post=' + encodeURIComponent(lead.slug) + '" style="text-decoration:none;color:inherit">'
          + shot(lead, 'shot')
          + '<div><span class="eyebrow">Latest</span><h2>' + esc(lead.title) + '</h2>'
          + (lead.excerpt ? '<p>' + esc(trim(lead.excerpt, 185)) + '</p>' : '')
          + '<span class="jmore">Read the post <span class="a" aria-hidden="true">&rarr;</span></span></div></a>'
          /* the month's post sells what it names, on the index as on the post
             (Sara, 14:15: "a product feed somewhere in it so that it makes the
             content more shoppable") */
          + railHtml(shopThis(lead), 'Shop this post')
        : '')
    + '<div class="jgrid">' + rest.map(card).join('') + '</div>';
})();
</script>
<script src="/assets/em-depth.js?v=3" defer></script>
