<style>
/* Two templates in one file, because a blog is two pages and they share
   everything: the listing, and one post. Which one renders depends on
   ?post= — the same switch /product/ and /meaning/ already use. */
.jhead{padding:clamp(30px,5vh,60px) 0 clamp(24px,3vw,38px)}
.jhead h1{font-family:var(--serif);font-weight:300;font-size:clamp(38px,5.4vw,62px);
  line-height:1.04;letter-spacing:-.018em;margin-top:14px}
.jhead .lead{margin-top:16px;max-width:52ch;color:var(--ink-soft)}

/* The lead post gets the width it deserves and the rest are a grid. A blog
   where every post is the same size has no editor in it. */
.jlead{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);
  gap:clamp(24px,4vw,54px);align-items:center;
  padding-bottom:clamp(30px,4vw,48px);border-bottom:1px solid var(--hair)}
.jlead .shot{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--tint)}
.jlead .shot img{width:100%;height:100%;object-fit:cover;display:block}
.jlead h2{font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.4vw,40px);
  line-height:1.1;letter-spacing:-.014em;margin:10px 0 0}
.jlead p{margin-top:14px;color:var(--ink-soft);max-width:52ch;line-height:1.6}
@media (max-width:820px){ .jlead{grid-template-columns:1fr;gap:18px} }

.jgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(20px,2.6vw,34px) clamp(18px,2.4vw,30px);padding:clamp(30px,4vw,50px) 0 0}
@media (max-width:900px){ .jgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:600px){ .jgrid{grid-template-columns:1fr;gap:26px} }
.jcard{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.jcard .shot{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--tint);
  border:1px solid var(--hair)}
.jcard .shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.jcard h3{font-family:var(--serif);font-weight:400;font-size:clamp(17px,1.7vw,20px);
  line-height:1.2;margin:13px 0 0}
.jcard p{margin-top:8px;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.jcard .k{font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--stone);margin-top:10px}
.jcard:hover h3{color:var(--copper)}

/* ---- one post ---- */
.post{max-width:none}
.post .back{display:inline-flex;align-items:center;gap:.45em;font-family:var(--sans);
  font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--stone);text-decoration:none;padding:11px 0;min-height:44px}
.post .back:hover{color:var(--copper)}
.post h1{font-family:var(--serif);font-weight:300;font-size:clamp(32px,4.6vw,54px);
  line-height:1.06;letter-spacing:-.018em;margin:6px 0 0;max-width:20ch}
.post .meta{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--stone);margin-top:18px}
.post .hero{margin-top:clamp(22px,3vw,34px);aspect-ratio:16/9;border-radius:10px;
  overflow:hidden;background:var(--tint)}
.post .hero img{width:100%;height:100%;object-fit:cover;display:block}
/* A measure, not the page. Body copy stops being readable somewhere around 75
   characters and their articles run to 2,183 words. */
.post .copy{max-width:66ch;margin:clamp(26px,3.4vw,42px) 0 0}
.post .copy p{color:var(--ink-soft);line-height:1.68;font-size:16px}
.post .copy p + p{margin-top:19px}
.post .copy h2{font-family:var(--serif);font-weight:400;font-size:clamp(21px,2.4vw,28px);
  line-height:1.16;margin:clamp(28px,3.4vw,40px) 0 0}
.post .copy h2 + p{margin-top:12px}
.jnext{margin-top:clamp(40px,5vw,68px);padding-top:clamp(26px,3vw,36px);
  border-top:1px solid var(--hair)}
.jnext .k{font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--stone)}
.missing{padding:clamp(50px,9vh,110px) 0}
</style>
</head>
<body>
<main>
<div class="wrap" id="journal"></div>
</main>

<script>
(function () {
  'use strict';
  var host = document.getElementById('journal');
  var POSTS = window.EM_JOURNAL || [];
  var slug = (location.search.match(/[?&]post=([^&]*)/) || [, ''])[1];
  slug = slug ? decodeURIComponent(slug) : '';

  /* This deleted the characters instead of escaping them, so every title
     with an ampersand lost it: "Stay Grounded & Raise Your Vibration"
     rendered as "Stay Grounded  Raise Your Vibration". Escape, don't strip. */
  function esc(t) {
    return String(t == null ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function shot(p, cls) {
    if (!p.img) return '<span class="' + cls + '"></span>';
    return '<span class="' + cls + '"><img src="' + p.img + '-1200.webp" '
      + 'srcset="' + p.img + '-600.webp 600w, ' + p.img + '-1200.webp 1200w" '
      + 'sizes="(max-width:600px) 92vw, 30vw" alt="" loading="lazy" decoding="async"></span>';
  }
  /* Cutting at a character count lands mid-word - "plugging in c". Back up
     to the last space and add the ellipsis there. */
  function trim(t, n) {
    t = String(t || '');
    if (t.length <= n) return t;
    var cut = t.slice(0, n);
    var sp = cut.lastIndexOf(' ');
    return (sp > n * 0.6 ? cut.slice(0, sp) : cut).replace(/[,;:.\s]+$/, '') + '\u2026';
  }

  function stamp(p) {
    /* Their articles carry no date and no author. Both exist on every Shopify
       article; this prints them the moment they are in the data, and says
       nothing rather than something invented while they are not. */
    return [p.date, p.author].filter(Boolean).join(' &middot; ');
  }

  if (slug) {
    var p = POSTS.filter(function (x) { return x.slug === slug; })[0];
    if (!p) {
      host.innerHTML = '<div class="missing"><span class="eyebrow">Not found</span>'
        + '<h1>That post has moved.</h1><p class="lead" style="margin-top:14px">'
        + '<a class="em-link" href="/blog/">Back to the journal</a></p></div>';
      return;
    }
    document.title = 'Energy Muse — ' + p.title;
    var md = document.querySelector('meta[name="description"]');
    if (md && p.excerpt) md.setAttribute('content', p.excerpt);

    var body = (p.body || []).map(function (b) {
      return b.t === 'h' ? '<h2>' + esc(b.x) + '</h2>' : '<p>' + esc(b.x) + '</p>';
    }).join('');
    if (!body && p.excerpt) body = '<p>' + esc(p.excerpt) + '</p>';

    var others = POSTS.filter(function (x) { return x.slug !== slug; }).slice(0, 3);

    host.innerHTML =
        '<article class="post">'
      + '<a class="back" href="/blog/"><span aria-hidden="true">&larr;</span> The journal</a>'
      + '<h1>' + esc(p.title) + '</h1>'
      + (stamp(p) ? '<div class="meta">' + stamp(p) + '</div>' : '')
      + (p.img ? '<div class="hero"><img src="' + p.img + '-1200.webp" '
          + 'srcset="' + p.img + '-600.webp 600w, ' + p.img + '-1200.webp 1200w" '
          + 'sizes="(max-width:820px) 92vw, 70vw" alt="" fetchpriority="high"></div>' : '')
      + '<div class="copy">' + body + '</div>'
      + '</article>'
      + (others.length
          ? '<section class="jnext"><span class="k">Keep reading</span>'
            + '<div class="jgrid">' + others.map(card).join('') + '</div></section>'
          : '');
    return;
  }

  function card(p) {
    return '<a class="jcard" href="?post=' + encodeURIComponent(p.slug) + '">'
      + shot(p, 'shot')
      + '<h3>' + esc(p.title) + '</h3>'
      + (p.excerpt ? '<p>' + esc(trim(p.excerpt, 130)) + '</p>' : '')
      + (stamp(p) ? '<span class="k">' + stamp(p) + '</span>' : '')
      + '</a>';
  }

  var lead = POSTS[0], rest = POSTS.slice(1);
  host.innerHTML =
      '<section class="jhead"><span class="eyebrow">The journal</span>'
    + '<h1>Practices, and what to work with now.</h1>'
    + '<p class="lead">Founder guidance, the month ahead, and how to actually use what you already own.</p>'
    + '</section>'
    + (lead
        ? '<a class="jlead" href="?post=' + encodeURIComponent(lead.slug) + '" style="text-decoration:none;color:inherit">'
          + shot(lead, 'shot')
          + '<div><span class="eyebrow">Latest</span><h2>' + esc(lead.title) + '</h2>'
          + (lead.excerpt ? '<p>' + esc(trim(lead.excerpt, 185)) + '</p>' : '') + '</div></a>'
        : '')
    + '<div class="jgrid">' + rest.map(card).join('') + '</div>';
})();
</script>
<script src="/assets/em-depth.js?v=3" defer></script>
</body></html>
