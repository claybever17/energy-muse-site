<style>
@font-face{font-family:'Fraunces';src:url(../../assets/fonts/fraunces_300.woff2?v=3) format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Fraunces';src:url(../../assets/fonts/fraunces_400.woff2?v=3) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url(../../assets/fonts/instrument_400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url(../../assets/fonts/instrument_600.woff2) format('woff2');font-weight:600;font-display:swap}
:root{
  --paper:#FBF8F2; --surface:#FFFFFF; --ink:#1D2739; --ink-soft:#4E5A70;
  --stone:#8D8778; --copper:#A9683E; --hair:#E4DCCB;
  --serif:'Fraunces',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif;
  /* the tuning: every one of these is driven by the dial */
  --tone:#A9683E; --tone-soft:#EBD9C9; --room:#FBF8F2;
}
*{box-sizing:border-box;margin:0}
body{background:var(--room);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .9s ease}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}

.bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:14px clamp(16px,3.4vw,40px);
  background:color-mix(in srgb,var(--room) 86%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid color-mix(in srgb,var(--hair) 60%,transparent);transition:background-color .9s ease}
.blogo{height:26px;width:auto;display:block}
.bag{display:inline-flex;align-items:center;padding:9px 16px;border-radius:100px;border:1px solid var(--hair);
  font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;background:var(--surface)}


/* ---------- the statement ----------
   The page used to open straight into the instrument, which read as a product
   page. It says who this is first, and the dial sits just under the fold so
   the selling starts immediately after. */
.state{position:relative;max-width:1400px;margin:0 auto;
  padding:clamp(34px,7vw,92px) clamp(16px,3.4vw,40px) clamp(20px,3vw,34px)}
.state .kicker{font:600 10.5px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--tone);transition:color .6s}
.state h1{font-family:var(--serif);font-weight:300;font-size:clamp(38px,7.4vw,94px);line-height:1.0;
  letter-spacing:-.028em;margin-top:14px;text-wrap:balance}
/* the second clause takes its own line — starting an italic mid-line leaves
   the first phrase broken across two and the emphasis stranded */
.state h1 em{display:block;font-style:italic;color:var(--tone);transition:color .6s}
/* balance, not pretty: pretty only rescues an orphan on the final line, so a
   two-line intro still breaks wherever it lands and leaves a stray word like
   "the" at the end of the first. balance evens the two. */
.state .said{margin-top:18px;max-width:54ch;font-size:clamp(15px,1.5vw,18px);color:var(--ink-soft);text-wrap:balance}
.state .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.act{display:inline-flex;align-items:center;padding:15px 26px;border-radius:2px;
  font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.act.solid{color:#fff;background:linear-gradient(160deg,#9E6038,#96592F 46%,#8A4E2C);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 26px rgba(169,104,62,.28)}
.act.ghost{border:1px solid color-mix(in srgb,var(--ink) 22%,transparent);color:var(--ink)}
.act.ghost:hover{border-color:var(--tone);color:var(--tone)}

/* less to read on a phone: the clauses that earn their place on a wide screen
   are the first thing in the way on a small one */
@media (max-width:640px){
  .lessmob{display:none}
  .state .said{font-size:15px}
  .tsay{min-height:0}
}

/* ---------- the room ---------- */
/* .roomin .device slides in from translateX(9%), which on a 390px phone put
   its right edge 10px past the viewport. A transient overflow is still an
   overflow: iOS Safari sizes the layout viewport to it and the page renders
   zoomed out. Clip on x only — y stays visible for the copy that rides out
   of the room. */
/* The header called for .tophead, .home and .tt and not one of them had a
   rule, so the logo and the title sat flush against the viewport edge while
   every other thing on the page was inset. Same max-width and same gutter as
   the room, so the page has one left edge — and laid out like the other two
   try-its: the eyebrow over the title, and the way home on the right, where
   the composition had been leaving a hole. */
.tophead{max-width:1400px;margin:0 auto;
  padding:clamp(18px,2.6vw,30px) clamp(16px,3.4vw,40px) 0;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.tophead .tt{min-width:0}
.tophead h1{font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.2vw,44px);
  line-height:1.05;letter-spacing:-.025em;margin-top:5px}
.tophead .home{flex:none;opacity:.72;transition:opacity .3s}
.tophead .home:hover{opacity:1}
@media (max-width:640px){
  .tophead{align-items:flex-start;flex-direction:column-reverse;gap:14px}
}

.room{overflow-x:clip;position:relative;max-width:1400px;margin:0 auto;padding:clamp(20px,3vw,40px) clamp(16px,3.4vw,40px) 0;
  display:grid;grid-template-columns:1fr minmax(0,540px);gap:clamp(24px,4vw,64px);align-items:center;
  min-height:min(74svh,680px)}
/* the glow used to bleed 30% past the room on each side, which pushed the
   document 400px wider than the viewport. The gradient's own falloff does
   the same job without leaving the box. */
.field{position:absolute;inset:-10% 0 0 0;z-index:0;pointer-events:none;
  background:radial-gradient(58% 52% at 66% 44%,color-mix(in srgb,var(--tone) 22%,transparent),transparent 70%);
  transition:background .9s ease}
.lede{position:relative;z-index:2}
.eyebrow{font:600 10.5px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--tone);transition:color .6s}
.readout{display:flex;align-items:baseline;gap:12px;margin-top:14px}
.num{font-family:var(--serif);font-weight:300;font-size:clamp(58px,11vw,132px);line-height:.92;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .6s}
.unit{font-family:var(--serif);font-weight:300;font-size:clamp(20px,3vw,34px);color:var(--stone)}
.tname{font-family:var(--serif);font-weight:300;font-style:italic;font-size:clamp(24px,3.6vw,42px);
  color:var(--tone);margin-top:2px;transition:color .6s}
.tsay{margin-top:16px;max-width:46ch;color:var(--ink-soft);font-size:15.5px;text-wrap:balance;min-height:3.2em}

/* ---------- the wave ---------- */
.wave{position:relative;z-index:1;margin-top:22px;height:104px;width:100%;max-width:560px}
.wave canvas{width:100%;height:100%;display:block}

/* ---------- the dial ---------- */
.dial{position:relative;z-index:2;margin-top:26px;max-width:560px}
.track{position:relative;height:2px;background:color-mix(in srgb,var(--hair) 90%,transparent);border-radius:2px}
.fillbar{position:absolute;left:0;top:0;height:100%;background:var(--tone);border-radius:2px;
  transition:width .5s cubic-bezier(.16,1,.3,1),background-color .6s}
.stops{display:flex;justify-content:space-between;margin-top:-9px}
.stop{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.stop i{width:9px;height:9px;border-radius:50%;background:var(--hair);display:block;
  transition:transform .35s cubic-bezier(.16,1,.3,1),background-color .35s}
.stop:hover i{transform:scale(1.35);background:color-mix(in srgb,var(--tone) 60%,var(--hair))}
.stop[aria-selected="true"] i{transform:scale(1.9);background:var(--tone)}
.stop b{position:absolute;top:32px;font:600 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;
  color:var(--stone);white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .3s}
.stop[aria-selected="true"] b{color:var(--ink)}
.dialhint{margin-top:34px;font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--stone)}

/* ---------- the instrument ---------- */
.device{position:relative;z-index:1;aspect-ratio:1;width:100%}
.device img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  transition:opacity .45s ease;will-change:opacity;animation:emDrift 9s ease-in-out infinite}
#genimg2{opacity:0}
/* The 3D model floated. Losing it should not leave the panel dead, so the
   photograph drifts instead — small enough to read as breathing, not motion. */
@keyframes emDrift{0%,100%{transform:translateY(-1.1%)}50%{transform:translateY(1.1%)}}
@media (prefers-reduced-motion:reduce){
  .device img{animation:none;transition:none}
}

/* ---------- what answers to it ---------- */
.answers{position:relative;max-width:1400px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(16px,3.4vw,40px)}
.ahead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--hair);margin-bottom:clamp(18px,2.4vw,28px)}
.ahead h2{font-family:var(--serif);font-weight:300;font-size:clamp(22px,3vw,34px)}
.ahead h2 em{font-style:italic;color:var(--tone);transition:color .6s}
.ahead a{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
  border-bottom:1px solid var(--tone);padding-bottom:2px}
.stones{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:clamp(12px,1.6vw,20px);min-height:120px}
/* On a phone the three cards stacked full width and ran to 1406px — most of
   the page, for three products, on a page whose point is the dial. A swipe
   rail keeps them readable and gives the height back to the instrument. */
@media(max-width:700px){
  .stones{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none}
  .stones::-webkit-scrollbar{display:none}
  .st{flex:0 0 62%;scroll-snap-align:start}
}
.st{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--hair);
  border-radius:14px;overflow:hidden;animation:rise .45s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.st .plate{position:relative;aspect-ratio:1;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:18%;flex:none;min-height:0;overflow:hidden;
  background:radial-gradient(70% 56% at 50% 42%,color-mix(in srgb,var(--sc) 24%,transparent),transparent 72%),
             linear-gradient(178deg,#fff 0 58%,color-mix(in srgb,var(--sc) 12%,#fff) 100%)}
.st .plate::after{content:"";position:absolute;left:50%;bottom:15.5%;translate:-50% 0;width:44%;height:6%;
  border-radius:50%;pointer-events:none;filter:blur(6px);opacity:.5;
  background:radial-gradient(50% 50% at 50% 50%,color-mix(in srgb,var(--sc) 55%,rgba(29,39,57,.3)),transparent 70%)}
.st .plate img{position:relative;z-index:1;max-width:70%;max-height:64%;width:auto;height:auto;object-fit:contain;
  /* em-depth.js drop-shadows every /products/ image site-wide to fake a
     contact shadow; the plate draws a real one, so the fake would double up
     and lift the stone back off the ground */
  filter:none;}
.st .c{padding:13px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.st .n{font-family:var(--serif);font-size:16px;line-height:1.2}
.st .k{font:600 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--stone);margin-top:2px}
.st .f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:11px}
.st .p{font-family:var(--serif);font-size:16.5px}
.st .a{font:700 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:7px 13px;
  border:1px solid var(--hair);border-radius:100px;transition:.18s}
.st .a:hover{background:var(--copper);border-color:var(--copper);color:#fff}
.st .a.done{background:var(--ink);border-color:var(--ink);color:#FBF8F2}

/* ---------- the instrument, for sale ---------- */
.buy{background:#0E1826;color:#EFE7D9}
.buyin{max-width:1400px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(16px,3.4vw,40px);
  display:grid;grid-template-columns:1fr minmax(0,460px);gap:clamp(28px,5vw,72px);align-items:center}
.buy h2{font-family:var(--serif);font-weight:300;font-size:clamp(30px,4.6vw,58px);line-height:1.04;letter-spacing:-.02em}
.buy p{margin-top:16px;max-width:52ch;color:#C3CAD6;text-wrap:pretty}
.pricerow{display:flex;align-items:baseline;gap:14px;margin-top:26px}
.was{color:#8994A6;text-decoration:line-through;font-family:var(--serif);font-size:19px}
.now{font-family:var(--serif);font-size:34px;color:#EFE7D9}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:16px 30px;border-radius:2px;color:#fff;
  background:linear-gradient(160deg,#9E6038,#96592F 46%,#8A4E2C);
  font:700 11.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 26px rgba(169,104,62,.32)}
.cta.done{background:#2B3648;box-shadow:none}
.specs{margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1)}
.spec{background:#0E1826;padding:14px 16px}
.spec dt{font:600 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#8994A6}
.spec dd{margin:4px 0 0;font-family:var(--serif);font-size:17px}
.buyart{position:relative;aspect-ratio:5/4;border-radius:14px;overflow:hidden;
  background:radial-gradient(60% 60% at 50% 42%,rgba(169,104,62,.22),transparent 70%)}
.buyart img{width:100%;height:100%;object-fit:contain}

/* ---------- why fixed ---------- */
.why{max-width:1400px;margin:0 auto;padding:clamp(48px,7vw,90px) clamp(16px,3.4vw,40px)}
.why h2{font-family:var(--serif);font-weight:300;font-size:clamp(24px,3.4vw,40px);max-width:20ch;line-height:1.08}
.whygrid{margin-top:clamp(24px,3vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:clamp(18px,2.6vw,36px)}
.why h3{font:600 10px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--tone);transition:color .6s}
.why p{margin-top:9px;color:var(--ink-soft);font-size:14.5px;text-wrap:pretty}


/* ===== the rest of the landing page =========================================
   Everything above is the instrument. Below it the page has the ordinary work
   of a homepage to do — intentions, the people, the shop, the sign-up — done
   in this version's own language: big photography that arrives as you reach
   it, the way lululemon reveals its sections. */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:none}

.tuned{max-width:1400px;margin:0 auto;padding:clamp(40px,6vw,84px) clamp(16px,3.4vw,40px)}
/* Headlines carry no ch measure. A cap that lands mid-phrase leaves a word
   hanging on its own line, which reads as an accident; balance keeps the
   lines even when a narrow screen genuinely does force a wrap. Body copy
   keeps its measure — that one is about reading, not about shape. */
.tuned h2{font-family:var(--serif);font-weight:300;font-size:clamp(26px,4vw,46px);line-height:1.06;text-wrap:balance}
.tuned h2 em{font-style:italic;color:var(--tone);transition:color .6s}
.tuned .sub{margin-top:14px;max-width:52ch;color:var(--ink-soft);text-wrap:balance}
.ints{margin-top:clamp(24px,3vw,42px);display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:clamp(10px,1.4vw,18px)}
.int{position:relative;aspect-ratio:3/4.1;border-radius:14px;overflow:hidden;display:block;text-align:left;
  border:1px solid var(--hair);background:#EFEAE1}
.int img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.int:hover img{transform:scale(1.045)}
.int .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,22,34,.78),rgba(15,22,34,.16) 52%,transparent)}
.int .lab{position:absolute;left:14px;right:14px;bottom:13px;color:#fff}
.int .lab b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.15}
.int .lab span{display:block;margin-top:3px;font:600 9.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.82}
.int[aria-pressed="true"]{outline:2px solid var(--tone);outline-offset:2px}

.people{position:relative;background:#0E1826;color:#EFE7D9;overflow:hidden}
.peoplein{max-width:1400px;margin:0 auto;padding:clamp(48px,7vw,104px) clamp(16px,3.4vw,40px);
  display:grid;grid-template-columns:1fr minmax(0,520px);gap:clamp(28px,5vw,72px);align-items:center}
.people h2{font-family:var(--serif);font-weight:300;font-size:clamp(28px,4.4vw,56px);line-height:1.04;letter-spacing:-.02em}
.people p{margin-top:16px;max-width:52ch;color:#C3CAD6;text-wrap:pretty}
.people .who{margin-top:22px;font:600 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#8994A6}
.pshot{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden}
.pshot img{width:100%;height:100%;object-fit:cover}

.shop{max-width:1400px;margin:0 auto;padding:clamp(48px,7vw,96px) clamp(16px,3.4vw,40px)}
.shophead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--hair);margin-bottom:clamp(18px,2.4vw,28px)}
.shophead h2{font-family:var(--serif);font-weight:300;font-size:clamp(24px,3.4vw,40px)}
.shophead a{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;
  border-bottom:1px solid var(--tone);padding-bottom:2px}

.join{background:var(--tone-soft);transition:background-color .9s ease}
.joinin{max-width:1400px;margin:0 auto;padding:clamp(44px,6vw,86px) clamp(16px,3.4vw,40px);
  display:grid;grid-template-columns:1fr minmax(0,440px);gap:clamp(22px,4vw,60px);align-items:center}
.join h2{font-family:var(--serif);font-weight:300;font-size:clamp(24px,3.4vw,42px);line-height:1.06;text-wrap:balance}
.join p{margin-top:12px;color:var(--ink-soft);max-width:46ch}
.jform{display:flex;gap:10px;flex-wrap:wrap}
.jform input{flex:1;min-width:180px;padding:15px 16px;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);
  border-radius:2px;background:rgba(255,255,255,.7);font:inherit;font-size:14.5px;color:var(--ink)}
.jform input::placeholder{color:var(--stone)}
.jform button{padding:15px 26px;border-radius:2px;color:#fff;background:var(--ink);
  font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase}
.jnote{margin-top:10px;font-size:12px;color:var(--stone)}

.foot{border-top:1px solid var(--hair)}
.footin{max-width:1400px;margin:0 auto;padding:clamp(34px,4vw,54px) clamp(16px,3.4vw,40px);
  display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.footin .fl{max-width:34ch;color:var(--ink-soft);font-size:13.5px}
.footin nav{display:flex;gap:clamp(18px,3vw,44px);flex-wrap:wrap}
.footin nav a{font-size:13.5px;color:var(--ink-soft);padding:3px 0}
.footin nav a:hover{color:var(--tone)}
.legal{max-width:1400px;margin:0 auto;padding:0 clamp(16px,3.4vw,40px) 30px;font-size:11.5px;color:var(--stone);
  display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}

@media (max-width:900px){
  .peoplein,.joinin{grid-template-columns:1fr}
  .pshot{order:-1}
}

@media (max-width:900px){
  .room{grid-template-columns:1fr;gap:22px;padding-top:14px;min-height:0}
  .device{order:-1;max-width:400px;margin:0 auto;width:100%}
  .wave{max-width:none;height:78px}
