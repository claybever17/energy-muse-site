<style>
/* The product grid. Lives here rather than in em-page.css: this is the only
   written page that lists products, and the shared sheet should hold what
   pages share. */
.jgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.6vw,22px);
  margin-top:clamp(26px,3.6vw,42px)}
@media (max-width:900px){.jgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.jgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.jcard{display:flex;flex-direction:column;border:1px solid var(--hair);border-radius:4px;
  background:var(--surface);padding:14px 14px 16px;transition:transform .4s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .3s}
.jcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--copper) 42%,transparent);
  box-shadow:0 14px 30px rgba(61,41,23,.10)}
.jcard img{aspect-ratio:1;object-fit:contain;background:var(--tint);border-radius:3px;padding:8%}
.jcard strong{font-family:var(--serif);font-weight:400;font-size:16px;line-height:1.25;margin-top:12px}
.jcard .jp{font-family:var(--serif);font-size:17px;color:var(--copper-lo);margin-top:4px}
.jadd{margin-top:12px;border:1px solid color-mix(in srgb,var(--ink) 26%,transparent);
  background:transparent;color:var(--ink);font-family:var(--sans);font-weight:600;font-size:12px;
  letter-spacing:.04em;padding:11px 12px;border-radius:3px;cursor:pointer;transition:.25s}
.jadd:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.plink{display:block;text-decoration:none;color:inherit}
.plink:focus-visible{outline:2px solid var(--copper);outline-offset:3px}

.jfilter{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}

/* Two rows of pills and 96px on a phone. Unlike /faq/'s jump links these are
   stateful - the filled pill is what tells you which filter is on - so they keep
   their shape and just stop wrapping. One row, scrolled sideways, 48px. */
@media (max-width:640px){
  .jfilter{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
    -ms-overflow-style:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .jfilter::-webkit-scrollbar{display:none}
  .jfilter > *{flex:none}
}
.jf{font-family:var(--sans);font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);background:var(--surface);border:1px solid var(--hair);border-radius:99px;
  padding:9px 16px;cursor:pointer;transition:border-color .25s,color .25s,background .25s}
.jf:hover{border-color:color-mix(in srgb,var(--copper) 50%,transparent);color:var(--copper)}
.jf.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.jcount{font-size:12.5px;color:var(--stone);margin-top:14px}
.jcard .jg{font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--stone);margin-top:9px;display:block}

/* same fix as the crystal shelf: pieces are different heights, so without a
   fixed frame and a common baseline the names and prices step up and down
   across the row */
.jcard{text-align:center}
.jcard img{aspect-ratio:1;object-fit:contain;width:100%;height:auto}
.jcard strong{min-height:2.6em;display:flex;align-items:center;justify-content:center;text-align:center}
.jcard .jg{text-align:center}
.jcard .jp{margin-top:2px}
.jcard .jadd{margin-top:auto}
/* Sold out. Same shape as the frequency shelf: the card dims, the photograph
   loses most of its colour, and the label takes exactly the footprint the
   button had — one word, one line, 44px — so a sold-out card never shunts the
   prices in its row out of line. */
.jcard.out{opacity:.66}
.jcard.out img{filter:saturate(.35)}
.jsold{margin-top:auto;font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--stone);border:1px solid var(--hair);border-radius:3px;
  padding:0 12px}
.jcard .jadd,.jcard .jsold{min-height:44px;display:flex;align-items:center;justify-content:center;
  box-sizing:border-box}

.jtools{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:14px}
.jsort{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12px;color:var(--ink-soft)}
.jsort span{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--stone)}
.jsort select{font-family:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--hair);border-radius:99px;padding:9px 12px;min-height:44px;cursor:pointer}
.jsort select:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

/* The shop's filter chips and sort control are both 44px; these were built
   before that and stayed at 34 and 38. Same standard now - the chip keeps its
   type size and gains the height, so nothing about it looks different except
   that it can be hit. */
@media (max-width:840px){
  .jf{min-height:44px;display:inline-flex;align-items:center;}
  select{min-height:44px;}
}

/* ===== Sept 3: the light card - Clay: "do it". The box and its border come
   off so the piece sits on its plate alone; the add is a compact light-glass
   pill instead of a full-width slab; the active chip takes the same glass. */
.jcard{background:transparent;border:0;box-shadow:none;padding:0;border-radius:0}
.jcard:hover{border-color:transparent;box-shadow:none;transform:translateY(-3px)}
.jcard .jadd,.jadd{align-self:center;width:auto;min-width:0;margin-top:12px;min-height:40px;padding:0 18px;font-size:12.5px;letter-spacing:.02em;text-transform:none;color:var(--ink,var(--fg));border:1px solid rgba(152,94,56,.38);border-radius:999px;background:linear-gradient(135deg,rgba(216,158,112,.26) 0%,rgba(184,122,75,.13) 55%,rgba(255,255,255,.22) 100%);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(152,94,56,.14),0 6px 18px rgba(152,94,56,.14);transition:background .25s,border-color .25s}
.jcard .jadd:hover,.jadd:hover{background:linear-gradient(135deg,rgba(216,158,112,.38) 0%,rgba(184,122,75,.2) 55%,rgba(255,255,255,.3) 100%);border-color:rgba(152,94,56,.6);color:var(--ink,var(--fg))}
.jf.on{color:var(--ink,var(--fg));border:1px solid rgba(152,94,56,.38);border-radius:999px;background:linear-gradient(135deg,rgba(216,158,112,.26) 0%,rgba(184,122,75,.13) 55%,rgba(255,255,255,.22) 100%);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(152,94,56,.14),0 6px 18px rgba(152,94,56,.14);transition:background .25s,border-color .25s;color:var(--ink,var(--fg))}
</style>

<main>
<section class="sect">
  <div class="wrap">
    <h1>Wear your <em class="hl gemword">energy.</em></h1>
    <!-- "Shop by Intention" was the primary call on the jewelry page and it went
         to /intention/ - away from the thirty-three pieces sitting directly
         below it. The same fault the homepage had. There is nothing to send
         anyone anywhere from here: the collection is the next thing on the
         page. What is left is the one genuine alternative, building a piece
         instead of choosing one. -->
    <div class="cta-row">
    <!-- "Build your own ->" sat under the lead like an afterthought - Clay: "silly here". The atelier has Try It in the header and the footer. -->
    </div>
    <!-- /shop/ and /gems/ both open straight into their grid: one section, the
         headline then the filters then the goods. This page had the collection
         in a second tinted section instead, so the chips arrived after a
         background change and 192px of padding and read as a fresh call to
         action rather than the controls for the grid under them. Merged.
         The sentence that sat here ("Real pieces from the Energy Muse
         collection, each formulated for one intention") said what the lead
         above already says, and #jcount prints "33 pieces" a line below. -->
    <!-- Thirty-three pieces now, from Energy Muse's own catalogue, filtered by
         the intention THEY tag each one with rather than a meaning we assigned. -->
    <div class="jfilter" id="jfilter">
      <button class="jf on" type="button" data-g="">Everything</button>
      <button class="jf" type="button" data-g="Protection">Protection</button>
      <button class="jf" type="button" data-g="Abundance">Abundance</button>
      <!-- The rewrite renames this intention Connection -> Love (COPY.md 3).
           The label is the only thing that changes: data-g stays "Connection"
           because that is the group the catalogue tags twenty products with,
           and it is what this button filters on. -->
      <button class="jf" type="button" data-g="Connection">Love</button>
      <button class="jf" type="button" data-g="Clarity">Clarity</button>
    </div>
    <div class="jtools">
      <p class="jcount" id="jcount"></p>
      <label class="jsort"><span>Sort</span>
        <select id="jsort">
          <option value="price-asc">Price, low to high</option>
          <option value="price-desc">Price, high to low</option>
          <option value="name">Name, A to Z</option>
        </select>
      </label>
    </div>
    <div class="jgrid" id="jgrid"></div>
    <div class="cta-row">
      <a class="btn btn-ghost" href="/learn/#jewelry">Jewelry Care Guide</a>
    </div>
  </div>
</section>

<!-- The "what you choose, and where you wear it" list came out - Clay: "this
     text / list also seems a bit redundent here". A shop page; the care
     section below stays. -->

<section class="sect">
  <div class="wrap narrow">
    <h2>How to keep your crystal jewelry cleansed.</h2>
    <p>You can energetically cleanse your jewelry by placing it on Selenite or a frequency generator daily. This practice ensures your jewelry emits the right energy.</p>
    <div class="cta-row"><a class="btn btn-copper" href="/frequency/">Explore Frequency Generators</a></div>
  </div>
</section>

</main>
<script>
document.querySelectorAll('.jadd').forEach(function(b){
  b.addEventListener('click',function(){
    if(!window.EMBag)return;
    EMBag.add({id:b.dataset.id,name:b.dataset.n,price:parseFloat(b.dataset.p),
               img:b.dataset.img,link:b.dataset.link});
  });
});
</script>

<script>
/* Built from em-catalog.js. This page carried eight pieces typed into the
   markup with their prices; it now carries every piece in the catalogue, and a
   price still exists in exactly one file. */
(function(){
  var host=document.getElementById('jgrid'), count=document.getElementById('jcount');
  if(!host||!window.EM_CATALOG)return;
  var ALL=window.EM_CATALOG.all().filter(function(p){return p.cat==='Jewelry';});
  var SORTS={
    'price-asc' :function(a,b){return a.price-b.price;},
    'price-desc':function(a,b){return b.price-a.price;},
    'name'      :function(a,b){return a.name.localeCompare(b.name);}
  };
  /* filter and sort belong in the URL — see the note on /gems/ */
  function readURL(){
    var q=new URLSearchParams(location.search);
    return {g:q.get('for')||'', s:SORTS[q.get('sort')]?q.get('sort'):'price-asc'};
  }
  function writeURL(g,srt){
    var q=new URLSearchParams(location.search);
    g?q.set('for',g.toLowerCase()):q.delete('for');
    srt&&srt!=='price-asc'?q.set('sort',srt):q.delete('sort');
    var qs=q.toString();
    history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);
  }
  function card(c){
    var out=(c.stock==='out');
    return '<div class="jcard'+(out?' out':'')+'" data-g="'+(c.group||'')+'">'
      +'<a class="plink" href="/product/?id='+encodeURIComponent(c.id)+'">'
      +'<img src="'+c.img+'" alt="'+String(c.name).replace(/"/g,'')+'" loading="lazy">'
      +'<strong>'+c.name+'</strong></a>'
      +(c.group?'<span class="jg">'+EM_CATALOG.label(c.group)+'</span>':'')
      +'<span class="jp">$'+c.price.toFixed(2)+'</span>'
      +(out ? '<span class="jsold">Unavailable</span>'
            : '<button class="jadd" type="button" data-id="'+c.id+'">Add to Bag</button>')+'</div>';
  }
  var bar=document.getElementById('jfilter'), sortEl=document.getElementById('jsort');
  function paint(g,srt){
    var list=(g?ALL.filter(function(c){return (c.group||'').toLowerCase()===g.toLowerCase();}):ALL.slice())
              .sort(SORTS[srt]||SORTS['price-asc']);
    if(window.EM_MORE)EM_MORE.paint(host,list,card);
    else host.innerHTML=list.map(card).join('');
    /* The catalogue tags this group "Connection"; the rewrite calls it Love.
       The filter still matches on the group, so only what is printed changes -
       otherwise the chip said Love and the line under it said connection. */
    var say=function(k){return (k||'').toLowerCase()==='connection'?'love':(k||'').toLowerCase();};
    count.textContent=list.length+(list.length===1?' piece':' pieces')+(g?' for '+say(g):'');
    if(bar)[].forEach.call(bar.children,function(x){
      x.classList.toggle('on',(x.getAttribute('data-g')||'').toLowerCase()===(g||'').toLowerCase());});
    if(sortEl) sortEl.value=srt;
  }
  var st=readURL();
  paint(st.g,st.s);
  if(bar) bar.addEventListener('click',function(e){
    var b=e.target.closest('.jf'); if(!b)return;
    st.g=b.getAttribute('data-g')||''; writeURL(st.g,st.s); paint(st.g,st.s);
  });
  if(sortEl) sortEl.addEventListener('change',function(){
    st.s=sortEl.value; writeURL(st.g,st.s); paint(st.g,st.s);
  });
  addEventListener('popstate',function(){ st=readURL(); paint(st.g,st.s); });
  var byId={}; ALL.forEach(function(c){byId[c.id]=c;});
  host.addEventListener('click',function(e){
    var b=e.target.closest('.jadd'); if(!b||!window.EMBag)return;
    var c=byId[b.getAttribute('data-id')]; if(!c)return;
    EMBag.add({id:c.id,name:c.name,price:c.price,img:c.img,link:'/product/?id='+c.id});
  });
})();
</script>
