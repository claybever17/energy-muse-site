<style>
/* The page Heather asked for: their own ten sections down to five, the
   photograph doing the work the headline stack used to, and one named product
   instead of a carousel of whatever is selling this week. */
.mhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
  gap:clamp(28px,5vw,68px);align-items:center;
  padding:clamp(30px,5vh,64px) 0 clamp(34px,5vw,58px)}
.mhero .shot{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--tint)}
.mhero .shot img{width:100%;height:100%;object-fit:cover;display:block}
.mhero .eyebrow{display:inline-flex;align-items:center;gap:14px}
.mhero h1{font-family:var(--serif);font-weight:300;font-size:clamp(38px,5.4vw,62px);
  line-height:1.04;letter-spacing:-.018em;margin-top:16px}
/* Their hook is three rhetorical questions in a row and it is the best thing on
   the page - it is how a reader recognises themselves. It leads. */
.mhook{margin-top:20px;font-family:var(--serif);font-weight:300;
  font-size:clamp(17px,1.7vw,21px);line-height:1.45;color:var(--ink-soft);max-width:40ch}

.msec{padding:clamp(34px,5vw,58px) 0;border-top:1px solid var(--hair)}
.msec h2{font-family:var(--serif);font-weight:300;font-size:clamp(24px,3vw,36px);
  line-height:1.1;letter-spacing:-.012em;margin:0}
.msec p{margin-top:14px;color:var(--ink-soft);max-width:68ch;line-height:1.62}
.muses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:clamp(20px,3vw,42px);margin-top:clamp(20px,2.6vw,30px)}
.muses.one{grid-template-columns:minmax(0,1fr);max-width:68ch}
.muse h3{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--copper);margin:0}
.muse p{margin-top:9px;font-size:14.5px}
@media (max-width:760px){ .muses{grid-template-columns:1fr;gap:22px} }

/* One product, named, sitting still. The carousel on their page is the thing
   she called confusing: it shows whatever is selling, which on a page about
   Black Tourmaline was an amethyst slice. */
.mbuy{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:clamp(16px,2.4vw,28px);
  align-items:center;padding:clamp(18px,2.4vw,26px);border:1px solid var(--hair);
  border-radius:10px;background:var(--surface);margin-top:clamp(22px,3vw,32px)}
.mbuy .sim{aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--tint);
  display:flex;align-items:center;justify-content:center;padding:8%}
.mbuy .sim img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.mbuy .k{font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--stone)}
.mbuy b{display:block;font-family:var(--serif);font-weight:400;
  font-size:clamp(18px,2vw,24px);line-height:1.16;margin-top:6px}
.mbuy .p{font-family:var(--serif);font-size:16px;color:var(--copper);margin-top:6px}
.mbuy .why{font-size:13.5px;color:var(--ink-soft);margin-top:8px;max-width:46ch;line-height:1.5}
@media (max-width:700px){
  .mbuy{grid-template-columns:96px minmax(0,1fr);gap:14px}
  .mbuy .madd{grid-column:1 / -1;width:100%}
}
.madd{font-family:var(--sans);font-weight:600;font-size:13px;min-height:48px;padding:0 26px;
  border:0;border-radius:3px;background:var(--copper);color:#fff;cursor:pointer;white-space:nowrap}
.madd:hover{filter:brightness(1.06)}
.madd.done{background:var(--ink)}

/* History and origin are the SEO ballast. They stay - deleting them would cost
   her the rankings the page exists for - but they fold away. */
.mref{border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.mref summary{cursor:pointer;list-style:none;display:flex;align-items:center;
  justify-content:space-between;gap:16px;padding:18px 0;min-height:56px;
  font-family:var(--sans);font-weight:600;font-size:12.5px;letter-spacing:.06em}
.mref summary::-webkit-details-marker{display:none}
.mref summary::after{content:"+";color:var(--copper);font-size:20px;line-height:1;flex:none}
.mref[open] summary::after{content:"\2013"}
.mref .in{padding-bottom:22px}
.mref .in p{margin-top:0;color:var(--ink-soft);max-width:68ch;line-height:1.6}
.mref .in p + p{margin-top:14px}

.mmore{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.mmore a{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.04em;
  text-decoration:none;color:var(--ink);border:1px solid var(--hair);border-radius:999px;
  padding:11px 18px;min-height:44px;display:inline-flex;align-items:center;transition:.2s}
.mmore a:hover{border-color:var(--copper);color:var(--copper)}
/* The hero stayed two columns at every width, which left the headline a 165px
   track - and "Tourmaline" at 38px does not fit in 165px. It overflowed by 27
   and took the document to 397 on a 390 screen, which is the width that makes
   iOS zoom the whole page out. One column on a phone, and the picture becomes
   a band: it is the stone itself here, so it earns its place, but not half a
   screen before the name of the thing. */
@media (max-width:760px){
  .mhero{grid-template-columns:1fr;gap:20px;padding-top:clamp(18px,3.6vh,30px)}
  .mhero .shot{aspect-ratio:4/3}
  .mhero h1{font-size:clamp(34px,9vw,46px)}
  .mhook{font-size:16.5px;max-width:none}
}
.missing{padding:clamp(50px,9vh,110px) 0;text-align:center}
</style>
</head>
<body>
<main>
<div class="wrap" id="stone"></div>
</main>

<script>
(function () {
  'use strict';
  var host = document.getElementById('stone');
  var key = (location.search.match(/[?&]stone=([^&]*)/) || [, 'black-tourmaline'])[1];
  key = decodeURIComponent(key);
  var S = (window.EM_STONES || {})[key];

  if (!S) {
    host.innerHTML = '<div class="missing"><span class="eyebrow">Not found</span>'
      + '<h1>We don\'t have a guide for that one yet.</h1>'
      + '<div class="mmore">' + Object.keys(window.EM_STONES || {}).map(function (k) {
          return '<a href="?stone=' + k + '">' + window.EM_STONES[k].name + '</a>'; }).join('')
      + '</div></div>';
    return;
  }

  document.title = 'Energy Muse — ' + S.name + ' Meaning';

  /* The product is named in the data and read out of the catalogue, so the
     price and the picture cannot drift from what the shop is selling. */
  var p = (window.EM_CATALOG && S.product) ? EM_CATALOG.get(S.product) : null;

  function esc(t) { return String(t == null ? '' : t).replace(/[<>&]/g, ''); }
  function sec(title, body) {
    return body ? '<section class="msec"><h2>' + title + '</h2>' + body + '</section>' : '';
  }

  var photo = S.photo
    ? '<div class="shot"><img src="/assets/img/c365/' + S.photo + '-1200.webp" '
      + 'srcset="/assets/img/c365/' + S.photo + '-600.webp 600w, /assets/img/c365/' + S.photo + '-1200.webp 1200w" '
      + 'sizes="(max-width:760px) 92vw, 44vw" alt="' + esc(S.name) + '" '
      + 'fetchpriority="high" decoding="async"></div>'
    : '';

  var uses = (S.uses || []).filter(function (u) { return u.text; });
  var usesHtml = uses.length
    ? '<div class="muses' + (uses.length === 1 ? ' one' : '') + '">'
      + uses.map(function (u) {
          return '<div class="muse"><h3>' + esc(u.title) + '</h3><p>' + esc(u.text) + '</p></div>';
        }).join('') + '</div>'
    : '';

  var buy = p
    ? '<div class="mbuy">'
      + '<span class="sim"><img src="' + p.img + '" alt="' + esc(p.name) + '" loading="lazy"></span>'
      + '<div><span class="k">Where to start</span><b>' + esc(p.name) + '</b>'
      + '<span class="p">$' + p.price.toFixed(2) + '</span>'
      + '<p class="why">One piece, not a shelf. Begin here and add another only when it '
      + 'makes the practice clearer.</p></div>'
      + (p.stock === 'out'
          ? '<span class="k">Currently unavailable</span>'
          : '<button class="madd" id="madd" type="button">Add to Bag</button>')
      + '</div>'
    : '';

  var refBody = '';
  if (S.history) refBody += '<p>' + esc(S.history) + '</p>';
  if (S.origin)  refBody += '<p>' + esc(S.origin) + '</p>';
  var ref = refBody
    ? '<details class="mref"><summary><span>History and origin</span></summary>'
      + '<div class="in">' + refBody + '</div></details>'
    : '';

  var others = Object.keys(window.EM_STONES).filter(function (k) { return k !== key; });

  host.innerHTML =
      '<section class="mhero">' + photo
    + '<div><span class="eyebrow">Crystal meaning</span>'
    + '<h1>' + esc(S.name) + '</h1>'
    + (S.hook ? '<p class="mhook">' + esc(S.hook) + '</p>' : '')
    + '</div></section>'
    + sec('What ' + S.name + ' is', S.meaning ? '<p>' + esc(S.meaning) + '</p>' : '')
    + sec('What it is for', usesHtml)
    + sec('How to use it', '<p>Put it where the intention lives — where you work, where you rest, '
        + 'or in a pocket for the day. Hold it and name what it is for; that is the whole practice, '
        + 'and the object is the reminder. Clear it with smoke, with sound, or simply by holding it '
        + 'and restating what it is for.</p>' + buy)
    + (ref ? '<section class="msec">' + ref + '</section>' : '')
    + (others.length
        ? '<section class="msec"><h2>Other stones</h2><div class="mmore">'
          + others.map(function (k) {
              return '<a href="?stone=' + k + '">' + esc(window.EM_STONES[k].name) + '</a>';
            }).join('') + '</div></section>'
        : '');

  var add = document.getElementById('madd');
  if (add && p) add.addEventListener('click', function () {
    if (!window.EMBag) return;
    EMBag.add({ id: p.id, name: p.name, price: p.price, img: p.img, link: '/product/?id=' + p.id });
    add.textContent = 'Added'; add.classList.add('done');
    clearTimeout(add._t); add._t = setTimeout(function () {
      add.textContent = 'Add to Bag'; add.classList.remove('done'); }, 1400);
  });
})();
</script>
<script src="/assets/em-depth.js?v=3" defer></script>
</body></html>
