<style>
/* One product, two columns: the thing on the left, the reason to want it on
   the right. Everything here is driven by ?id= — there is one of these pages,
   not thirty-nine. */
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(28px,5vw,72px);align-items:start}
/* place-items:center here meant the image was never stretched to the grid
   area, so width/height:100% had no definite box to resolve against: the
   image laid out 402x463 inside a 402x402 content box and overflow:hidden
   sheared the bottom off the stone. object-fit:contain never got to run,
   because the element box was already the wrong size.

   The default stretch gives the image the area's real dimensions and contain
   does the letterboxing from there. Same mistake, smaller, collapsed the
   gallery thumbnails to 6x7 pixels — see .pthumb. */
.pshot{position:relative;background:var(--tint);border-radius:6px;aspect-ratio:1;
  display:grid;padding:7%;overflow:hidden}
.pshot img{width:100%;height:100%;min-width:0;min-height:0;object-fit:contain}
/* No mark in here. em-page.css already turns one behind the first section of
   every page, and a second copy of the same asset a few hundred pixels away
   read as exactly what it was: the same thing twice, both competing with the
   product the frame exists to show. */
.crumb{font-family:var(--sans);font-size:12px;color:var(--stone);margin-bottom:16px}
.crumb a{color:var(--stone);text-decoration:none}
.crumb a:hover{color:var(--copper)}
.pcat{font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--copper);display:block;margin-bottom:10px}
.pdp h1{font-size:clamp(28px,3.6vw,46px);max-width:16ch}
.pprice{font-family:var(--serif);font-weight:300;font-size:clamp(26px,2.8vw,34px);
  color:var(--copper-lo);margin-top:16px}
.pdesc{font-size:16.5px;color:var(--ink-soft);margin-top:18px;max-width:52ch;line-height:1.62}
.pbuy{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.bigadd{border:1px solid var(--copper);background:var(--copper);color:#fff;font-family:var(--sans);
  font-weight:600;font-size:15px;padding:16px 34px;border-radius:3px;cursor:pointer;
  transition:transform .3s cubic-bezier(.16,1,.3,1),background .3s}
.bigadd:hover{background:var(--copper-lo);transform:translateY(-2px)}
.bigadd.done{background:var(--ink);border-color:var(--ink)}
.soldout{border:1px solid var(--hair);color:var(--stone);font-family:var(--sans);font-weight:600;
  font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:16px 26px;border-radius:3px}
.pfacts{list-style:none;margin-top:30px;border-top:1px solid var(--hair)}
.pfacts li{display:grid;grid-template-columns:118px 1fr;gap:16px;padding:13px 0;
  border-bottom:1px solid var(--hair);font-size:14px}
.pfacts b{font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--stone);align-self:center}
.pfacts span{color:var(--ink-soft)}
.rel{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,1.6vw,22px);margin-top:clamp(26px,3.5vw,40px)}
.rcard{display:block;text-decoration:none;color:inherit;border:1px solid var(--hair);border-radius:4px;
  background:var(--surface);padding:13px 14px 16px;
  transition:transform .4s cubic-bezier(.16,1,.3,1),border-color .3s}
.rcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--copper) 42%,transparent)}
.rcard .shot{display:block;aspect-ratio:1;background:var(--tint);border-radius:3px;padding:9%}
.rcard .shot img{width:100%;height:100%;object-fit:contain}
.rcard .n{display:block;font-family:var(--sans);font-weight:600;font-size:13px;line-height:1.3;
  margin-top:11px;color:var(--ink)}
.rcard .p{display:block;font-family:var(--serif);font-size:16px;color:var(--copper-lo);margin-top:5px}
.missing{text-align:center;padding:clamp(40px,8vw,90px) 0}

@media (max-width:1000px){.rel{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){.pdp{grid-template-columns:1fr;gap:26px}}
@media (max-width:640px){.rel{grid-template-columns:repeat(2,1fr)}}

/* The gallery. Every product had exactly one photograph, and their catalogue
   carries three to eleven — for a $124 necklace a second angle is most of the
   decision. Thumbnails sit under the frame; the frame itself does not move. */
.pgal{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.pthumb{width:64px;height:64px;flex:none;border:1px solid var(--hair);border-radius:4px;
  background:var(--tint);padding:5px;cursor:pointer;display:block;box-sizing:border-box;
  transition:border-color .25s}
/* Explicit size, not max-size. As max-width/max-height:100% on an auto-sized
   image inside a centred grid, these collapsed to 6x7 pixels out of a 539x620
   photograph — the percentage had nothing definite to resolve against. The
   frame states the size and object-fit does the letterboxing, which is the
   pattern that already works on every product grid. */
.pthumb img{width:100%;height:100%;object-fit:contain;display:block}
.pthumb:hover{border-color:color-mix(in srgb,var(--copper) 55%,transparent)}
.pthumb[aria-current="true"]{border-color:var(--copper)}
.pthumb:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.pshot img{transition:opacity .28s ease}
.pshot.swapping img{opacity:0}
@media (max-width:520px){.pthumb{width:56px;height:56px}}
/* Size sits between the price and the description, the way Energy Muse's own
   page orders it. 44px on the control, and the measurement under it rather
   than inside the option labels, so the line reads at a glance. */
.psize{margin-top:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.psize label{font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--stone)}
.psize select{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--hair);border-radius:4px;padding:11px 34px 11px 13px;min-height:44px;
  cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='none' stroke='%236D695D' stroke-width='1.5' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 13px center;background-size:11px}
.psize select:focus-visible{outline:2px solid var(--copper);outline-offset:2px;border-color:var(--copper)}
.pdim{font-size:13.5px;color:var(--ink-soft);margin:0}
@media (max-width:600px){
  /* the measurement takes its own line rather than squeezing beside the control */
  .psize{gap:10px 12px}
  .pdim{flex-basis:100%;margin-top:-2px}
}

/* Three collapsed rows rather than three headings and a wall: the buyer who
   wants the size opens Details, the one who wants to know if it can go in
   water opens Care, and the one who has already decided is not made to scroll
   past either. Same device as /learn/ and /faq/, which is where a reader of
   this site has already met it. */
.ppanels{margin-top:clamp(26px,3vw,36px);border-top:1px solid var(--hair)}
.ppanel{border-bottom:1px solid var(--hair)}
.ppanel summary{cursor:pointer;list-style:none;display:flex;align-items:center;
  justify-content:space-between;gap:16px;padding:16px 0;min-height:56px;
  font-family:var(--sans);font-weight:600;font-size:12.5px;letter-spacing:.06em}
.ppanel summary::-webkit-details-marker{display:none}
.ppanel summary::after{content:"+";color:var(--copper);font-family:var(--sans);
  font-size:20px;line-height:1;flex:none}
.ppanel[open] summary::after{content:"\2013"}
.ppanel summary:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.pbody{padding:0 0 20px}
.pbody ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pbody li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.pbody li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;
  border-radius:50%;background:var(--copper);opacity:.5}
.pbody dl{margin:0;display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px 16px}
.pbody dt{font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--stone);padding-top:2px}
.pbody dd{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
@media (max-width:560px){
  .pbody dl{grid-template-columns:1fr;gap:2px 0}
  .pbody dd{margin-bottom:8px}
}

/* Sept 2: glass - the product page's Add to Bag joins the site's light glass */
.bigadd{color:var(--ink,var(--fg));border:1px solid rgba(152,94,56,.38);border-radius:999px;background:linear-gradient(135deg,rgba(216,158,112,.26) 0%,rgba(184,122,75,.13) 55%,rgba(255,255,255,.22) 100%);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(152,94,56,.14),0 8px 24px rgba(152,94,56,.16)}
.bigadd:hover{background:linear-gradient(135deg,rgba(216,158,112,.38) 0%,rgba(184,122,75,.2) 55%,rgba(255,255,255,.3) 100%);border-color:rgba(152,94,56,.6)}

/* Sept 3: the second button beside Add to Bag was a boxed ghost next to a
   glass pill - "seems out of place". It is the arrow link the rest of the
   site uses for the light offer. */
.seeall{display:inline-flex;align-items:center;gap:.45em;min-height:44px;margin-left:14px;
  font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--copper);text-decoration:none}
.seeall .a{transition:transform .25s}
.pmeaning{margin:14px 0 0;display:inline-flex}
.seeall:hover{color:var(--copper-lo)}
.seeall:hover .a{transform:translateX(3px)}

/* ===== Sept 3: the light card, as on the catalogue grids: the related pieces
   sit on their plates without a box. */
.rcard{background:transparent;border:0;box-shadow:none;padding:0;border-radius:0}
.rcard:hover{border-color:transparent;box-shadow:none;transform:translateY(-3px)}
</style>
</head><body>
<main>
<section class="sect">
  <div class="wrap" id="pdp"></div>
</section>
<section class="sect tint" id="relwrap" hidden>
  <div class="wrap">
    <h2>Goes with this.</h2>
    <div class="rel" id="rel"></div>
  </div>
</section>
</main>
<script>
/* The label was p.cat lowercased, so a crystal read "See all crystal".
   Three of the four categories just take an s; Jewelry is a mass noun and
   would come out "jewelrys", so the plurals are named rather than derived.
   Destinations, for the record: Crystal /gems/, Jewelry /jewelry/,
   System /systems/, Kit /sets/. */
var SEEALL_PLURAL={Crystal:'crystals',Jewelry:'jewelry',System:'systems',Kit:'kits'};
function SEEALL(c){return SEEALL_PLURAL[c] || String(c||'').toLowerCase();}

(function(){
  var C = window.EM_CATALOG;
  var host = document.getElementById('pdp');
  var id = new URLSearchParams(location.search).get('id') || '';

  /* The meaning link: a stone that has a meaning page gets one line under its
     description. Matched by the catalogue id the stone names as its product,
     then by name; anything else renders nothing. Guarded - the paint must
     never depend on the stones table having loaded. */
  function meaningLink(p){
    var S = window.EM_STONES; if (!S || !p) return '';
    var keys = Object.keys(S), hit = '', i, nm = String(p.name || '').toLowerCase();
    for (i = 0; i < keys.length; i++) if (S[keys[i]].product === p.id) { hit = keys[i]; break; }
    if (!hit) for (i = 0; i < keys.length; i++) {
      var sn = String(S[keys[i]].name || '').toLowerCase();
      if (sn && nm.indexOf(sn) !== -1) { hit = keys[i]; break; }
    }
    if (!hit) return '';
    return '<a class="seeall pmeaning" href="/meaning/?stone=' + encodeURIComponent(hit) + '">Read the '
      + S[hit].name + ' meaning <span class="a" aria-hidden="true">&rarr;</span></a>';
  }
  var p = C && C.get(id);

  if (!p) {
    /* An unknown id is a normal thing to hit — a stale link, a typo, a product
       retired. Say so and offer the way on, rather than rendering an empty
       shell that looks broken. */
    host.innerHTML = '<div class="missing"><span class="pcat">Not found</span>'
      + '<h1>We couldn&rsquo;t find that one.</h1>'
      + '<p class="lead" style="margin-left:auto;margin-right:auto">It may have been retired, or the '
      + 'link may have picked up a typo along the way.</p>'
      + '<div class="cta-row" style="justify-content:center">'
      + '<a class="btn btn-copper" href="/shop/">Back to the Shop</a>'
      + '<a class="btn btn-ghost" href="/quiz/">Find My Energy Match</a></div></div>';
    return;
  }

  document.title = 'Energy Muse — ' + p.name;
  var md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', p.desc || p.name);


/* Details, how to use, and care.
 *
 * /support/ and the FAQ both answer "how do I care for my product?" with
 * "each product page includes material-specific care" - a promise this page
 * was not keeping. Everything below is Energy Muse's own material: the
 * mineral rules are lifted from their FAQ answers word for word, the
 * practice lines from the intention pages' own steps, and the details are
 * read off the catalogue rather than written. Nothing here is invented, and
 * where there is nothing true to say the section does not render.
 *
 * Per-product copy - the paragraph a buyer really wants - is the client's to
 * write. When it arrives it belongs on the item as `use` and `details`, and
 * the two lines marked below will prefer it over the type-level text.
 */
var WATER_SHY = ['selenite','malachite','turquoise','pyrite','halite','angelite','calcite','kyanite','lepidolite'];
var LIGHT_SHY = ['amethyst','rose quartz','citrine','fluorite','celestite','opal','smoky quartz'];

function mentions(name, list){
  var n = String(name || '').toLowerCase();
  for (var i = 0; i < list.length; i++) if (n.indexOf(list[i]) > -1) return list[i];
  return null;
}

function careFor(p){
  var lines = [];
  /* the one instruction that is safe for every mineral they sell, in the
     words their own FAQ uses */
  lines.push('Clear it with smoke, with sound, or simply by holding it and restating what it is for. All three are safe for every mineral.');
  var w = mentions(p.name, WATER_SHY), l = mentions(p.name, LIGHT_SHY);
  if (w) lines.push('Keep it out of water. ' + (w === 'selenite'
      ? 'Selenite dissolves.'
      : (w === 'pyrite' ? 'Pyrite rusts.' : 'Prolonged water damages ' + w + '.'))
      + ' A dry cloth is never the wrong answer.');
  else if (/quartz/i.test(p.name)) lines.push('Quartz is generally fine with water, though a dry cloth is never the wrong answer.');
  else lines.push('When you are unsure about water, don\'t \u2014 a dry cloth is never the wrong answer.');
  if (l) lines.push('Keep it out of prolonged direct sun, which fades ' + l + '. A windowsill is the most common way a stone quietly bleaches over a few months.');
  if (p.cat === 'Jewelry') lines.push('Elastic is happier slightly loose than slightly stretched. Take it off before water, sleep and the gym.');
  return lines;
}

function useFor(p){
  if (p.cat === 'Frequency') return [
    'Set it where you spend the time you want it to affect \u2014 a desk, a bedside table, the room you work in.',
    'Leave it on. It holds one frequency and stays there; there is nothing to tune.',
    'Not a medical device, and not a substitute for professional care.'];
  if (p.cat === 'Jewelry') return [
    'Wear it where you will see it. The point is the reminder, not the object.',
    'Measure your wrist snug but not tight and take the size at or just above that number \u2014 beads sit on the inside of the curve, so a bracelet wears smaller than it measures.',
    'Between two sizes, take the larger one.'];
  return [
    'Put it where the intention lives \u2014 where you work, where you rest, or in a pocket for the day.',
    'Hold it and name what it is for. That is the whole practice; the object is the reminder.',
    'One at a time. Add a second piece only when it makes the practice clearer.'];
}

function detailsFor(p){
  var rows = [];
  if (p.sizes && p.sizes.length) {
    rows.push(['Sizes', p.sizes.map(function(v){
      return v.t + (v.d ? ' \u00b7 approx. ' + v.d : ''); }).join('<br>')]);
  }
  rows.push(['Type', p.cat + (p.sub ? ' \u00b7 ' + p.sub : '')]);
  if (p.group) rows.push(['Intention', EM_CATALOG.label(p.group)]);
  rows.push(['Natural variation', 'Every piece is a natural material, so colour, pattern and exact size differ from the photograph.']);
  return rows;
}

function panel(id, title, inner){
  return '<details class="ppanel" id="' + id + '"><summary><span>' + title + '</span></summary>'
       + '<div class="pbody">' + inner + '</div></details>';
}

function buildPanels(p){
  var use = p.use || useFor(p);              /* client copy wins when it lands */
  var det = p.details || detailsFor(p);
  var care = careFor(p);
  return '<div class="ppanels">'
    + panel('p-use', 'How to use it', '<ul>' + use.map(function(l){ return '<li>' + l + '</li>'; }).join('') + '</ul>')
    + panel('p-det', 'Details', '<dl>' + det.map(function(r){
        return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('') + '</dl>')
    + panel('p-care', 'Care', '<ul>' + care.map(function(l){ return '<li>' + l + '</li>'; }).join('') + '</ul>')
    + '</div>';
}

  var out = (p.stock === 'out');
  /* the main shot first, then whatever else the catalogue carries for it */
  var shots = [p.img].concat(p.imgs || []);
  var facts = [];
  if (p.group) facts.push(['Intention', EM_CATALOG.label(p.group)]);
  facts.push(['Category', p.cat]);
  if (p.cat === 'Frequency') facts.push(['Tuned to', p.name.replace(' Frequency Generator', '') + ', and left there']);

  host.innerHTML =
    '<div class="pdp">'
    + '<div><div class="pshot"><img id="pmain" src="' + p.img + '" alt="' + p.name.replace(/"/g,'') + '"></div>'
    + (shots.length > 1
        ? '<div class="pgal" role="group" aria-label="More views">'
          + shots.map(function(src, i){
              return '<button class="pthumb" type="button" data-src="' + src + '"'
                   + (i === 0 ? ' aria-current="true"' : '')
                   + ' aria-label="View ' + (i + 1) + ' of ' + shots.length + '">'
                   + '<img src="' + src + '" alt="" loading="lazy"></button>';
            }).join('')
          + '</div>'
        : '')
    + '</div>'
    + '<div>'
    + '<p class="crumb"><a href="/shop/">Shop</a> &nbsp;/&nbsp; <a href="' + p.home + '">' + p.cat + '</a></p>'
    + '<span class="pcat">' + (EM_CATALOG.label(p.group) || p.cat) + '</span>'
    + '<h1>' + p.name + '</h1>'
    + '<div class="pprice" id="pprice">$' + p.price.toFixed(2) + '</div>'
    /* Energy Muse sells most stones and every bracelet in sizes, and the size
       carries the dimension: S (0.75"-1"). Their own page puts the selector
       under the price with the measurement beneath it, so this does the same.
       Products without variants render nothing here at all. */
    + (p.sizes && p.sizes.length > 1
        ? '<div class="psize">'
          + '<label for="psel">Size</label>'
          + '<select id="psel">'
          + p.sizes.map(function(v, n){
              return '<option value="' + n + '">' + v.t + '</option>'; }).join('')
          + '</select>'
          + '<p class="pdim" id="pdim">' + (p.sizes[0].d ? 'Approx. ' + p.sizes[0].d : '') + '</p>'
          + '</div>'
        : '')
    + '<p class="pdesc">' + (p.desc || '') + '</p>'
    + meaningLink(p)
    + '<div class="pbuy">'
    + (out ? '<span class="soldout">Currently unavailable</span>'
           : '<button class="bigadd" id="bigadd" type="button">Add to Bag</button>')
    + '<a class="seeall" href="' + p.home + '">See all ' + SEEALL(p.cat) + ' <span class="a" aria-hidden="true">&rarr;</span></a>'
    + '</div>'
    + buildPanels(p)
    + '</div></div>';

  /* Thumbnails swap the frame rather than navigating. The image fades so the
     change reads as the same object turning rather than a page flicker, and
     the arrow keys walk the row because a gallery you can only mouse is a
     gallery half the visitors cannot use. */
  var gal = host.querySelector('.pgal');
  if (gal) {
    var main = document.getElementById('pmain');
    var thumbs = [].slice.call(gal.querySelectorAll('.pthumb'));
    function show(i) {
      var b = thumbs[i]; if (!b) return;
      var src = b.getAttribute('data-src');
      if (main.getAttribute('src') === src) { b.focus(); return; }
      var frame = main.parentNode;
      frame.classList.add('swapping');
      /* The swap only happened inside pre.onload, and onload is not guaranteed
         for an image the browser already has: assign a cached src and Safari can
         have complete true before the handler is attached, so the event never
         arrives. The frame then keeps .swapping and the picture never changes,
         which reads as a tap that did not register. There was no onerror either,
         so a missing file stuck it the same way, permanently.
         swap() is idempotent and every path reaches it. */
      var pre = new Image();
      var done = false;
      function swap() {
        if (done) return; done = true;
        main.src = src;
        requestAnimationFrame(function(){ frame.classList.remove('swapping'); });
      }
      pre.onload = swap;
      pre.onerror = swap;
      pre.src = src;
      if (pre.complete) swap();
      thumbs.forEach(function (t, n) { t.setAttribute('aria-current', n === i ? 'true' : 'false'); });
    }
    gal.addEventListener('click', function (e) {
      var b = e.target.closest('.pthumb'); if (!b) return;
      show(thumbs.indexOf(b));
    });
    gal.addEventListener('keydown', function (e) {
      var i = thumbs.indexOf(document.activeElement.closest('.pthumb'));
      if (i < 0) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); show((i + 1) % thumbs.length); thumbs[(i + 1) % thumbs.length].focus(); }
      if (e.key === 'ArrowLeft')  { e.preventDefault(); var j = (i - 1 + thumbs.length) % thumbs.length; show(j); thumbs[j].focus(); }
    });
  }

  /* One selected size, read by the price line, the dimension line and the bag. */
  var chosen = (p.sizes && p.sizes.length) ? p.sizes[0] : null;
  var psel = document.getElementById('psel');
  if (psel) psel.addEventListener('change', function(){
    chosen = p.sizes[Number(psel.value)] || p.sizes[0];
    var pr = document.getElementById('pprice');
    var dm = document.getElementById('pdim');
    if (pr) pr.textContent = '$' + chosen.p.toFixed(2);
    if (dm) dm.textContent = chosen.d ? 'Approx. ' + chosen.d : '';
  });

  var add = document.getElementById('bigadd');
  if (add) add.addEventListener('click', function(){
    if (!window.EMBag) return;
    /* The bag keys on id and adds a quantity when it sees the same one twice,
       so a size has to make its own key or two sizes of one stone would merge
       into a single line. The link still points at the base product. */
    var sized = chosen && p.sizes && p.sizes.length > 1;
    EMBag.add({ id: sized ? p.id + '::' + chosen.t : p.id,
                name: sized ? p.name + ' — ' + chosen.t : p.name,
                price: sized ? chosen.p : p.price, img: p.img,
                link: '/product/?id=' + p.id });
    add.textContent = 'Added to bag'; add.classList.add('done');
    setTimeout(function(){ add.textContent = 'Add to Bag'; add.classList.remove('done'); }, 1600);
  });

  var rel = C.related(p.id, 4);
  if (rel.length) {
    document.getElementById('relwrap').hidden = false;
    document.getElementById('rel').innerHTML = rel.map(function(r){
      return '<a class="rcard" href="/product/?id=' + r.id + '">'
        + '<span class="shot"><img src="' + r.img + '" alt="" loading="lazy"></span>'
        + '<span class="n">' + r.name + '</span>'
        + '<span class="p">$' + r.price.toFixed(2) + '</span></a>';
    }).join('');
  }
})();
</script>
</body></html>
