<!doctype html><html><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow"><title>gem thumbs generator</title>
<style>body{margin:0;background:#222}#sheet{width:100%;display:block}</style></head><body>
<canvas id="sheet" width="2048" height="1024"></canvas>
<script type="importmap">{"imports":{"three":"../assets/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from '../assets/jsm/loaders/GLTFLoader.js';
window.addEventListener('error',e=>{window.__err=(e.message||'')+' @'+e.lineno;});

const CELL=512, COLS=4;
const ORDER=['calm','spirituality','wealth','protection','fresh-start','love','wellness','power'];
const COLORS={spirituality:0x8656B8,wealth:0xC9A54E,protection:0x383E47,'fresh-start':0xE8EDF2,
  love:0xE08098,wellness:0x3EAFA5,power:0x9A6633,calm:0xA9C0DA};
const HASGLB=['calm','protection','wellness'];

const rcan=document.createElement('canvas');
const renderer=new THREE.WebGLRenderer({canvas:rcan,antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(CELL,CELL,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101826);
const camera=new THREE.PerspectiveCamera(34,1,0.05,50);
camera.position.set(0.5,0.7,3.05);camera.lookAt(0,0,0);
(function env(){
  const cv=document.createElement('canvas');cv.width=64;cv.height=256;const x=cv.getContext('2d');
  const base=x.createLinearGradient(0,0,0,256);
  base.addColorStop(0,'#4a5262');base.addColorStop(.5,'#262c37');base.addColorStop(1,'#0e1219');
  x.fillStyle=base;x.fillRect(0,0,64,256);
  function strip(cy,h,a){const s=x.createLinearGradient(0,cy-h,0,cy+h);s.addColorStop(0,'rgba(255,251,243,0)');s.addColorStop(.5,'rgba(255,251,243,'+a+')');s.addColorStop(1,'rgba(255,251,243,0)');x.fillStyle=s;x.fillRect(0,cy-h,64,h*2);}
  strip(48,28,0.95);strip(150,22,0.5);
  const t=new THREE.CanvasTexture(cv);t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;
  const p=new THREE.PMREMGenerator(renderer);scene.environment=p.fromEquirectangular(t).texture;t.dispose();p.dispose();
})();
scene.add(new THREE.HemisphereLight(0xdfe6f0,0x22262e,0.65));
const key=new THREE.DirectionalLight(0xfff2e0,1.6);key.position.set(2.2,3.2,2.4);scene.add(key);
const rim=new THREE.DirectionalLight(0xcfe0ff,0.7);rim.position.set(-2.2,1.4,-2.2);scene.add(rim);
let holder=new THREE.Group();scene.add(holder);
const loader=new GLTFLoader();

/* same builders as the gallery */
function jitter(geo,amp,fy){const p=geo.attributes.position;const v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);
    const s=1+amp*Math.sin(v.x*7.1)*Math.cos(v.y*5.3+v.z*3.7);
    p.setXYZ(i,v.x*s,v.y*s*(fy||1),v.z*s);}
  geo.computeVertexNormals();return geo;}
function genericStone(color){
  const mat=new THREE.MeshPhysicalMaterial({color,metalness:0.05,roughness:0.18,transparent:true,opacity:0.92,
    clearcoat:0.8,clearcoatRoughness:0.15,envMapIntensity:1.3,flatShading:true,emissive:color,emissiveIntensity:0.06});
  return new THREE.Mesh(jitter(new THREE.IcosahedronGeometry(0.8,1),0.16,1.25),mat);}
function crystalPoint(r,hBody,hTip,mat){const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(r,r*0.92,hBody,6),mat);body.position.y=hBody/2;g.add(body);
  const tip=new THREE.Mesh(new THREE.ConeGeometry(r,hTip,6),mat);tip.position.y=hBody+hTip/2;g.add(tip);return g;}
function buildAmethyst(){
  const g=new THREE.Group();
  const rock=new THREE.MeshStandardMaterial({color:0x8a8f96,roughness:0.9,flatShading:true});
  const base=new THREE.Mesh(jitter(new THREE.IcosahedronGeometry(0.72,1),0.18,0.5),rock);
  base.scale.y=0.42;base.position.y=-0.32;g.add(base);
  const amy=new THREE.MeshPhysicalMaterial({color:0x8656B8,metalness:0,roughness:0.12,transparent:true,opacity:0.9,
    clearcoat:1,clearcoatRoughness:0.08,envMapIntensity:1.6,flatShading:true,emissive:0x2a1440,emissiveIntensity:0.35});
  const spots=[[0,0,0,.20,.55],[.3,.05,.1,.13,.38],[-.28,.02,.14,.12,.34],[.12,.03,-.26,.14,.4],
               [-.16,.04,-.22,.11,.3],[.34,.02,-.14,.10,.26],[-.36,.03,-.02,.10,.3],[.02,.05,.3,.12,.3]];
  spots.forEach(sp=>{const c=crystalPoint(sp[3],sp[4],sp[3]*1.7,amy);
    c.position.set(sp[0],-0.18,sp[2]);
    c.rotation.set((Math.random()-0.5)*0.5,Math.random()*Math.PI,(Math.random()-0.5)*0.5);g.add(c);});
  g.position.y=0.05;return g;}
function buildPyrite(){
  const g=new THREE.Group();
  const py=new THREE.MeshStandardMaterial({color:0xC9A54E,metalness:1.0,roughness:0.32,envMapIntensity:1.8,flatShading:true});
  const cubes=[[0,0,0,.62,0.3],[.42,-.28,.18,.34,0.8],[-.38,-.3,-.12,.3,0.4],[.1,-.42,-.34,.26,1.1]];
  cubes.forEach(c=>{const m=new THREE.Mesh(new THREE.BoxGeometry(c[3],c[3],c[3]),py);
    m.position.set(c[0],c[1]*0.6,c[2]);m.rotation.set(c[4],c[4]*1.7,c[4]*0.6);g.add(m);});
  g.position.y=0.15;return g;}
function buildQuartzPyramid(){
  const mat=new THREE.MeshPhysicalMaterial({color:0xF2F5F8,metalness:0,roughness:0.06,transparent:true,opacity:0.55,
    clearcoat:1,clearcoatRoughness:0.04,envMapIntensity:1.7,flatShading:true,emissive:0x40454e,emissiveIntensity:0.12});
  const g=new THREE.Group();
  const p=new THREE.Mesh(new THREE.ConeGeometry(0.72,0.95,4),mat);p.position.y=0.12;p.rotation.y=Math.PI/4;g.add(p);
  return g;}
function buildTourmaline(){
  const g=new THREE.Group();
  const tm=new THREE.MeshPhysicalMaterial({color:0x23262c,metalness:0.15,roughness:0.32,clearcoat:0.9,
    clearcoatRoughness:0.25,envMapIntensity:1.3,flatShading:true});
  const rods=[[0,0,0,.20,1.15,0],[.26,-.06,.06,.13,.86,.18],[-.24,-.1,-.04,.12,.72,-.22],[.05,-.12,-.24,.11,.6,.3]];
  rods.forEach(r=>{const rod=new THREE.Mesh(new THREE.CylinderGeometry(r[3],r[3]*1.06,r[4],6),tm);
    rod.position.set(r[0],r[1],r[2]);rod.rotation.z=r[5];g.add(rod);});
  g.position.y=0.1;return g;}
const BUILDERS={spirituality:buildAmethyst,wealth:buildPyrite,'fresh-start':buildQuartzPyramid,protection:buildTourmaline};

function fit(obj){
  const box=new THREE.Box3().setFromObject(obj);
  const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
  const s=1.15/Math.max(size.x,size.y,size.z);
  obj.position.sub(center).multiplyScalar(s);obj.scale.setScalar(s);
  const wrap=new THREE.Group();wrap.add(obj);return wrap;}

function loadModel(slug){
  return new Promise(res=>{
    if(HASGLB.includes(slug)){
      loader.load(`../assets/gems/${slug}.glb`,g=>res(fit(g.scene)),undefined,
        ()=>res(fit(BUILDERS[slug]?BUILDERS[slug]():genericStone(COLORS[slug]))));
    } else {
      res(fit(BUILDERS[slug]?BUILDERS[slug]():genericStone(COLORS[slug])));
    }
  });
}

const sheet=document.getElementById('sheet');
const ctx=sheet.getContext('2d');
const Q=new URLSearchParams(location.search);
const ONLY=Q.get('only'),YAW=parseFloat(Q.get('yaw')||'0.5'),PITCH=parseFloat(Q.get('pitch')||'-0.05');
(async()=>{
  if(ONLY){
    scene.remove(holder);holder=new THREE.Group();scene.add(holder);
    const m=await loadModel(ONLY);
    holder.add(m);holder.rotation.y=YAW;holder.rotation.x=PITCH;
    renderer.render(scene,camera);
    sheet.width=512;sheet.height=512;
    ctx.drawImage(rcan,0,0,512,512);
    window.__sprite=sheet.toDataURL('image/jpeg',0.88);
    window.__ready=true;return;
  }
  for(let i=0;i<ORDER.length;i++){
    const slug=ORDER[i];
    scene.remove(holder);holder=new THREE.Group();scene.add(holder);
    const m=await loadModel(slug);
    holder.add(m);holder.rotation.y=0.5;holder.rotation.x=-0.05;
    renderer.render(scene,camera);
    ctx.drawImage(rcan,(i%COLS)*CELL,Math.floor(i/COLS)*CELL,CELL,CELL);
  }
  window.__sprite=sheet.toDataURL('image/jpeg',0.86);
  window.__ready=true;
})();
</script></body></html>
